<!DOCTYPE html>
<html>
<head>
    <title>Onse</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            background-color: #ff4c4c;
            color: white;
            padding: 10px;
            border-radius: 10px 10px 0 0;
            font-size: 2em;
        }
        .box {
            margin: 20px 0;
        }
        .message {
             
            background-color: #ffefc5;
            color: #d2691e;
            font-style: italic;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .icons {
            margin: 20px 0;
            font-size: 2em;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
        }
        .footer a {
            text-decoration: none;
            color: #ff4c4c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🎄 Onse 🎄</div>
        <div class="box">
            <p>Hey, <strong>John Doe</strong>!</p>
            <p>You are the Secret Santa for: <strong>Jane Doe</strong> 🎁</p>
            <p>Gift budget: <strong>1 €</strong> 💸</p>
            <div class="message">Test message</div>
            <div class="icons">🦌⛄</div>
            <p>Wishing you a Merry Christmas! ✨</p>
        </div>
        <div class="footer">
            <p>Made with ❤️ and ☕ by <a href="https://github.com/mnau23" target="_blank">mnau23</a> © 2024</p>
        </div>
    </div>
</body>
</html>
