<!DOCTYPE html>
<html>
    <head>
        <title>Onse Secret Santa</title>
        <meta charset="utf-8">
        <style>
            body {
                font-family: "Inter", Arial, sans-serif;
                background: #111;
                margin: 0;
                padding: 32px 12px;
                color: #eee;
            }
            .card {
                max-width: 480px;
                margin: auto;
                background: #1a1a1a;
                border-radius: 20px;
                padding: 32px;
                box-shadow: 0 0 28px rgba(255, 0, 65, 0.15);
                border: 1px solid rgba(255, 0, 65, 0.25);
            }
            .header {
                text-align: center;
                font-size: 1.9em;
                font-weight: 700;
                color: #ff4d4d;
                margin-bottom: 12px;
                letter-spacing: 0.5px;
            }
            .section {
                margin: 20px 0 10px 0;
            }
            .label {
                font-weight: 600;
                color: #ffcccc;
            }
            .receiver {
                margin-top: 4px;
                font-size: 1.05em;
                font-weight: bold;
                color: #ffffff;
            }
            .budget {
                background: rgba(255, 215, 0, 0.15);
                border-left: 4px solid gold;
                padding: 10px 14px;
                border-radius: 10px;
                margin-top: 10px;
                color: #ffffff;
            }
            .message {
                margin-top: 24px;
                text-align: center;
                font-size: 0.95em;
                color: #bbb;
            }
            .footer {
                margin-top: 28px;
                text-align: center;
                font-size: 0.9em;
                color: #777;
            }
            .footer a {
                color: #ff4d4d;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="header">Onse Secret Santa 🎅🏻</div>

            <div class="section">
                <div class="label">Are you ready? Find the best gift for:</div>
                <div class="receiver">{{.ReceiverName}}</div>
            </div>

            <div class="section">
                <div class="label">Budget:</div>
                {{if .Budget}}
                    <div class="budget">{{.Budget}} € 💸</div>
                {{else}}
                    <div class="budget">No budget specified</div>
                {{end}}
            </div>

            <div class="message">
                Wishing you a Merry Christmas and lots of fun in this Secret Santa! ✨
            </div>

            <div class="footer">
                Made with ❤️ and 🤖 by <a href="https://github.com/mnau23" target="_blank">mnau23</a> © 2025
            </div>

        </div>
    </body>
</html>
